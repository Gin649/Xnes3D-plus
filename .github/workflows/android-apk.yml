name: Android APK

# Builds the Android APK of this fork (run it from the Actions tab). The fork's changes let a
# frontend start a game directly: see ZaxnesActivity.getArguments and LaunchedRom.
#
# The fork installs as its own app, Zaxnes Plus (io.github.gin649.zaxnes, with its own icon and
# colours: .github/fork/branding.py), beside the official Zaxnes, and is
# signed with rust/build/android/fork.keystore so each build installs over the last one, keeping
# its profiles and saves. That key is only for this personal fork.
on:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK parts the build script needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust (the version in rust-toolchain.toml) and cargo-ndk
        working-directory: rust
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target-android
          key: android-${{ hashFiles('rust/Cargo.lock') }}

      - name: Zaxnes Plus branding (app id, names, icon, colours)
        run: |
          python3 .github/fork/branding.py
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" compile --dir .github/fork/res -o "$RUNNER_TEMP/fork-res.zip"
          echo "ZAXNES_EXTRA_RES=$RUNNER_TEMP/fork-res.zip" >> "$GITHUB_ENV"
          git diff --stat

      - name: Stand-ins for the demo game's files
        # FlappyZaxNes and its 3D profile are built apart and kept out of the repository; empty
        # files let the app build, and an empty demo is simply not installed (demo_game.rs).
        run: |
          cd rust/crates/zax-app/demo
          [ -f FlappyZaxNes.nes ] || : > FlappyZaxNes.nes
          [ -f flappyzaxnes.3dn ] || : > flappyzaxnes.3dn

      - name: The 3D profiles made for Zaxnes (nixxou/zaxnes_3dn, CC BY-NC-ND 4.0)
        # build.rs puts the .3dn files of this folder in the app, which copies them into the
        # profiles at the first start, as the official builds do.
        run: |
          git clone --depth 1 https://github.com/nixxou/zaxnes_3dn "$RUNNER_TEMP/zaxnes_3dn"
          echo "ZAXNES_3DN_DIR=$RUNNER_TEMP/zaxnes_3dn" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: rust
        env:
          ZAXNES_ANDROID_KEYSTORE: ${{ github.workspace }}/rust/build/android/fork.keystore
          ZAXNES_ANDROID_KEYSTORE_PASSWORD: android
        run: python3 -I build/package-android.py

      - uses: actions/upload-artifact@v4
        with:
          name: Zaxnes-android-fork
          path: rust/target-android/package/*.apk

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)
          tag="v${version}-plus.${{ github.run_number }}"
          apk=$(ls rust/target-android/package/*.apk | head -1)
          cp "$apk" "ZaxnesPlus-${version}-plus.${{ github.run_number }}-android-arm64.apk"
          gh release create "$tag" "ZaxnesPlus-${version}-plus.${{ github.run_number }}-android-arm64.apk" \
            --target "${{ github.sha }}" --title "Zaxnes Plus ${version} (build ${{ github.run_number }})" \
            --notes "Zaxnes ${version} with the Zaxnes Plus changes: games open straight from a launcher, quitting a game started that way goes back to it, and a profiles folder (Zaxnes Plus profiles). Installs beside the official Zaxnes. Based on nixxou/zaxnes, GPL-3.0."
