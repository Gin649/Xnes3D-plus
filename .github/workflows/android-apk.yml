name: Android APK

# Builds the Android APK of this fork (run it from the Actions tab). The fork's changes let a
# frontend start a game directly: see ZaxnesActivity.getArguments and LaunchedRom.
#
# The fork installs as its own app, Xnes3D+ (io.github.gin649.zaxnes, with its own icon and
# colours: .github/fork/branding.py), beside the official Zaxnes, and is
# signed with rust/build/android/fork.keystore so each build installs over the last one, keeping
# its profiles and saves. That key is only for this personal fork.
on:
  workflow_dispatch:
    inputs:
      test_build:
        # Xnes3D+: a test build makes the APK and keeps it on the run's page only (Artifacts),
        # with no version check and no release, so nobody is offered it as an update.
        description: 'Test build (no release, APK only in the run artifacts)'
        type: boolean
        default: false

permissions:
  contents: write # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Xnes3D+: each build is a release named after .github/fork/VERSION. Stop at once, before
      # the long build, when that version was already released: raise the version first.
      - name: The version is new
        if: ${{ !inputs.test_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < .github/fork/VERSION)
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "::error::Xnes3D+ v${version} is already released. Raise .github/fork/VERSION first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK parts the build script needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust (the version in rust-toolchain.toml) and cargo-ndk
        working-directory: rust
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target-android
          key: android-${{ hashFiles('rust/Cargo.lock') }}

      - name: Xnes3D+ branding (app id, names, icon, colours)
        run: |
          python3 .github/fork/branding.py
          # The interface font, Pixelify Sans (SIL Open Font License), packed as a raw resource
          # (ZaxnesActivity.interfaceFont).
          mkdir -p .github/fork/res/raw
          curl -fsSL -o .github/fork/res/raw/pixelify_sans.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" compile --dir .github/fork/res -o "$RUNNER_TEMP/fork-res.zip"
          echo "ZAXNES_EXTRA_RES=$RUNNER_TEMP/fork-res.zip" >> "$GITHUB_ENV"
          git diff --stat

      - name: Stand-ins for the demo game's files
        # FlappyZaxNes and its 3D profile are built apart and kept out of the repository; empty
        # files let the app build, and an empty demo is simply not installed (demo_game.rs).
        run: |
          cd rust/crates/zax-app/demo
          [ -f FlappyZaxNes.nes ] || : > FlappyZaxNes.nes
          [ -f flappyzaxnes.3dn ] || : > flappyzaxnes.3dn

      # Xnes3D+: the 3D profiles made for Zaxnes are in the repository now (rust/profiles,
      # see zax-app's build.rs), so nothing is downloaded for them.

      - name: Build the APK
        working-directory: rust
        env:
          ZAXNES_ANDROID_KEYSTORE: ${{ github.workspace }}/rust/build/android/fork.keystore
          ZAXNES_ANDROID_KEYSTORE_PASSWORD: android
        # Xnes3D+: rust/target-android is cached between runs, so the APKs of earlier builds
        # come back with it. Clear them first, so only this build's APK is uploaded and released.
        run: |
          rm -rf target-android/package
          python3 -I build/package-android.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.test_build && format('Xnes3D-plus-test-{0}', github.ref_name) || 'Zaxnes-android-fork' }}
          path: rust/target-android/package/*.apk

      - name: Publish it as a release
        if: ${{ !inputs.test_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < .github/fork/VERSION)
          zaxnes=$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)
          tag="v${version}"
          # The APK this build made (package-android.py names it after the version), never an
          # older one.
          apk="rust/target-android/package/Zaxnes-${version}-android-arm64.apk"
          test -f "$apk"
          cp "$apk" "Xnes3D-plus-${version}-android-arm64.apk"
          # A tag left behind by a deleted release (the first step made sure no release uses
          # it) is removed, so the new release's tag points at this build.
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag}" 2> /dev/null || true
          gh release create "$tag" "Xnes3D-plus-${version}-android-arm64.apk" --latest \
            --target "${{ github.sha }}" --title "Xnes3D+ v${version}" \
            --notes "Xnes3D+, a 3D NES emulator for Android built on nixxou's Zaxnes ${zaxnes}: an NES look, your own ROM and saves folders, RetroArch-style hotkeys (L2 rewind, R2 fast forward, R1 save, L1 load, L3+R3 menu), 15 rotating save states and an auto save, 3D profiles from its own menus, and Smart 3D for games without a profile. Installs beside the official Zaxnes. Based on nixxou/zaxnes, GPL-3.0. Interface font: Pixelify Sans (SIL Open Font License)."
