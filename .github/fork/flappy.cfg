# Memory layout to build FlappyZaxNes (NROM-256, 32 KiB PRG, 8 KiB CHR) for the Smart 3D preview.
# The game keeps some variables in the console's own RAM at $0400 (its "BSS2" segment).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM2:   start = $0400, size = $0400, type = rw, file = "";
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    PRG:    start = $8000, size = $7FFA, file = %O, fill = yes, fillval = $FF;
    VEC:    start = $FFFA, size = $0006, file = %O, fill = yes;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS2:     load = RAM2,   type = bss;
    HEADER:   load = HEADER, type = ro;
    STARTUP:  load = PRG,    type = ro;
    CODE:     load = PRG,    type = ro;
    RODATA:   load = PRG,    type = ro;
    VECTORS:  load = VEC,    type = ro;
    CHARS:    load = CHR,    type = ro;
}
